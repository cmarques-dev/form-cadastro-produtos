<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Products Management</h1>
      <p>github.com/cmarques-dev</p>
    </header>

    <main>
      <section class="cartao">
        <h2>Create Product</h2>
        <form id="form-add-product">
          <label for="nome">Name</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Price (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantity</label>
          <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Ex: 10" required />

          <button type="submit" id="salvar">Add</button>
        </form>
      </section>

      <section class="cartao">
        <h2>Products</h2>
        <ul id="lista-produtos">
        </ul>
      </section>

      <section class="cartao" id="form-change-product">
        <form id="form-change-product">
          <h2>Change Product</h2>

          <label for="id-produto">Product ID:</label>
          <input type="number" name="id-produto" id="id-produto" min="1" placeholder="Ex: 1" required />

          <label for="alterar-nome">Name</label>
          <input type="text" id="alterar-nome" name="alterar-nome" placeholder="Ex: Caderno" required />

          <label for="alterar-preco">Price (R$)</label>
          <input type="number" id="alterar-preco" name="alterar-preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="alterar-quantidade">Quantity</label>
          <input type="number" id="alterar-quantidade" name="alterar-quantidade" min="1" placeholder="Ex: 10" required />

          <button type="submit" id="edit">Change</button>
          <button type="button" id="remove">Remove</button>
        </form>
      </section>
    </main>

    <footer>Work to Fundamentos Web subject for Lucas Bailo at Unilago University.</footer>

    <script src="script.js"></script>
  </body>
</html>
